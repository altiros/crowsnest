# Generate with: make xcode  (xcodegen generate --spec App/project.yml)
name: CrowsnestApp
options:
  developmentLanguage: en
  bundleIdPrefix: com.altiros
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""   # set your own team ID for device builds
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  Crowsnest:
    path: ..
targets:
  Crowsnest iPad:
    type: application
    platform: iOS
    sources: [iOS, ../Resources/Assets.xcassets]
    dependencies:
      - package: Crowsnest
        product: CrowsnestUI
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Crowsnest
        PRODUCT_BUNDLE_IDENTIFIER: com.altiros.Crowsnest
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crowsnest
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"  # TLS and signature checks only (exempt)
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Crowsnest connects to Kubernetes clusters on your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  Crowsnest macOS:
    type: application
    platform: macOS
    sources: [../Sources/Crowsnest, ../Resources/Assets.xcassets]
    dependencies:
      - package: Crowsnest
        product: CrowsnestUI
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Crowsnest
        PRODUCT_BUNDLE_IDENTIFIER: com.altiros.Crowsnest
        INFOPLIST_FILE: ../Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        # Not sandboxed: needs ~/.kube and exec auth plugins (aws, gcloud, kubelogin).
