name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For open-ended ideas or questions, a
        [discussion](https://github.com/altiros/crowsnest/discussions) may be a better place.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and what's missing or cumbersome today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Crowsnest to do?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - iPadOS
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, examples from other tools, links.
